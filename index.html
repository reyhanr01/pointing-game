<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>They Point At You 👉</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Two stacked photos so we can crossfade between pointing directions -->
  <img id="photoA" class="photo visible" src="img/point-camera.jpg" alt="People pointing at your cursor" />
  <img id="photoB" class="photo" src="img/point-camera.jpg" alt="People pointing at your cursor" />

  <!-- The "locking on" ring that fills while your cursor settles -->
  <div id="ring" class="hidden">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" class="ring-bg" />
      <circle cx="26" cy="26" r="22" class="ring-fg" id="ringFg" />
    </svg>
  </div>

  <div id="hint" class="hint">
    <h1>👉 They point at you</h1>
    <p>Hold your cursor still for a moment…<br />and they'll point right at it.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
