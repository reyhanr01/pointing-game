<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>They Point At You 👉</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Two stacked layers so we can crossfade. Each layer has a blurred
       ambient background plus the sharp photo that swivels to aim. -->
  <div class="layer visible" id="layerA">
    <div class="mover" id="moverA">
      <img class="bg" id="bgA" src="img/online-1259327.jpg" alt="" />
      <img class="sharp" id="photoA" src="img/online-1259327.jpg" alt="People pointing at your cursor" />
    </div>
  </div>
  <div class="layer" id="layerB">
    <div class="mover" id="moverB">
      <img class="bg" id="bgB" src="img/online-1259327.jpg" alt="" />
      <img class="sharp" id="photoB" src="img/online-1259327.jpg" alt="People pointing at your cursor" />
    </div>
  </div>

  <!-- The "locking on" ring that fills while your cursor settles -->
  <div id="ring" class="hidden">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" class="ring-bg" />
      <circle cx="26" cy="26" r="22" class="ring-fg" id="ringFg" />
    </svg>
  </div>

  <div id="hint" class="hint">
    <h1>👉 They point at you</h1>
    <p>Hold your cursor still for a moment…<br />and they'll point right at it.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
